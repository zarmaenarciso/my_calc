name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
  workflow_dispatch:

jobs:
  deploy-firestore:
    name: Deploy Firestore Rules & Indexes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy Firestore rules & indexes
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA_JSON" ]; then
            echo "::error::Missing GitHub Secret FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          SA_FILE="${{ runner.temp }}/firebase-sa.json"
          printf '%s' "$FIREBASE_SA_JSON" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          PROJECT_ID=$(node -e "const sa = JSON.parse(process.env.FIREBASE_SA_JSON); console.log(sa.project_id)")
          npx --yes firebase-tools deploy --only firestore --project "$PROJECT_ID" --non-interactive
